# pico2hsm daemon configuration -- local two-HSM setup
#
# Both HSMs are plugged into the same Linux host via USB.
# Reader 0 = primary, Reader 1 = secondary.
# The daemon auto-syncs DKEK material and keys from primary to secondary
# whenever the secondary device is connected via USB.
#
# To list connected readers and verify indices:
#   opensc-tool --list-readers

# ---- Network listener ----
# IP address to bind the TCP listener on.
# "127.0.0.1" restricts to loopback (local only, not exposed on network).
# Use "0.0.0.0" to accept connections from remote peers.
listen_address: "127.0.0.1"

# TCP port for inter-daemon communication.
# Set to 0 to disable the TCP listener entirely (USB-only mode).
listen_port: 7890

# ---- Storage ----
# Directory for persistent state (state.json, generation counters, TLS certs).
# The daemon creates this directory on first run if it does not exist.
# Ownership should be pico2hsm:pico2hsm with mode 0700.
state_dir: "/var/lib/pico2hsm"

# ---- Logging ----
# Python logging level. One of: DEBUG, INFO, WARNING, ERROR.
# DEBUG is very verbose (every APDU and USB event).
log_level: "INFO"

# ---- Sync behaviour ----
# Automatically sync when a secondary device is detected via USB.
# Set to false if you want manual sync only (via hsm_daemon.py sync <name>).
sync_on_connect: true

# ---- TLS ----
# Enable TLS for TCP transport between daemon instances.
# Not needed for loopback (both devices on the same host).
# Enable this when using network sync between separate machines.
tls_enabled: false

# Path to this daemon's TLS certificate (PEM format).
# If not set and tls_enabled is true, an ephemeral self-signed cert is generated.
# identity_cert: "/etc/pico2hsm/certs/daemon.crt"

# Path to this daemon's TLS private key (PEM format).
# identity_key: "/etc/pico2hsm/certs/daemon.key"

# ---- Cluster ----
# Cluster identifier. All daemons in a cluster must use the same cluster_id.
# Used during enrollment to prevent cross-cluster sync.
cluster_id: "local-cluster"

# ---- Peers ----
# Each peer represents a physical HSM device.
# Exactly one peer must have role "primary". Others are "secondary".
# For local (USB-only) peers, omit the "address" field.
#
# Public keys are required for enrollment verification. Extract them with:
#   python -c "
#   from pico2hsm import Pico2HSM
#   from pico2hsm.enrollment import DeviceEnrollment
#   with Pico2HSM() as hsm:
#       hsm.connect()
#       hsm.select_applet()
#       info = DeviceEnrollment.get_device_info(hsm)
#       DeviceEnrollment.save_pubkey_pem(info.pubkey, 'device.pub.pem')
#   "
peers:
  - name: "primary"
    role: "primary"
    # P-256 public key file for this device (65-byte uncompressed point, PEM-wrapped).
    public_key_file: "/etc/pico2hsm/keys/primary.pub.pem"
    # No address -- this is a local USB device (reader index 0).

  - name: "secondary"
    role: "secondary"
    # P-256 public key file for this device.
    public_key_file: "/etc/pico2hsm/keys/secondary.pub.pem"
    # No address -- this is a local USB device (reader index 1).
