# pico2hsm daemon configuration -- network primary node
#
# This is the PRIMARY node in a two-site network sync setup.
# It listens on port 7890 and accepts incoming sync requests from the
# secondary node at 192.168.1.11.
#
# The primary device is connected to this machine via USB.
# The secondary device is connected to the remote machine running its own
# daemon instance (see config-network-secondary.yaml).
#
# Data flow: secondary daemon connects TO this node's TCP listener,
# requests the key manifest, downloads any missing DKEK-wrapped key blobs,
# and imports them onto its local secondary HSM.
#
# TLS is enabled. On first run the daemon auto-generates a self-signed
# certificate in state_dir (daemon.crt / daemon.key). For production,
# replace these with properly issued certificates and configure cert_path
# on the peer entry so each side can verify the other.

# ---- Network listener ----
# Bind on all interfaces so the secondary node can reach us.
listen_address: "0.0.0.0"

# TCP port for peer connections. Must be reachable from the secondary.
# Ensure firewall rules allow inbound TCP on this port.
listen_port: 7890

# ---- Storage ----
state_dir: "/var/lib/pico2hsm"

# ---- Logging ----
log_level: "INFO"

# ---- Sync behaviour ----
# On the primary, sync_on_connect controls USB auto-sync if a second
# local device is plugged in. Usually true.
sync_on_connect: true

# ---- TLS ----
# Enable TLS for all TCP connections. Strongly recommended for network sync.
tls_enabled: true

# This daemon's TLS identity. Auto-generated on first run if not specified.
# For production, use certificates issued by your internal CA.
identity_cert: "/var/lib/pico2hsm/daemon.crt"
identity_key: "/var/lib/pico2hsm/daemon.key"

# ---- Cluster ----
cluster_id: "prod-cluster"

# ---- Peers ----
peers:
  - name: "hsm-primary"
    role: "primary"
    # The primary device is local (no address needed).
    public_key_file: "/etc/pico2hsm/keys/hsm-primary.pub.pem"

  - name: "hsm-secondary"
    role: "secondary"
    # The secondary daemon's address -- used for outbound health checks
    # and state hash verification. The secondary also connects inbound to us.
    address: "192.168.1.11:7890"
    public_key_file: "/etc/pico2hsm/keys/hsm-secondary.pub.pem"
    # TLS certificate of the secondary node for mutual authentication.
    # Obtain this from the secondary node's state_dir/daemon.crt.
    cert_path: "/etc/pico2hsm/certs/secondary-node.crt"
