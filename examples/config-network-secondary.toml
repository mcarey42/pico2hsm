# pico2hsm Rust daemon configuration -- network secondary node
#
# This is the SECONDARY node in a two-site network sync setup.
# It connects TO the primary node to fetch DKEK material and key blobs.
#
# The secondary HSM device is connected to this machine via USB.
# The primary HSM device is on the remote machine at 192.168.1.10.

# Listen for inbound connections (the primary may initiate health-check
# state hash comparisons).
listen_address = "0.0.0.0"

# TCP port for the peer protocol.
listen_port = 7777

# Directory for persistent state.
state_dir = "/var/lib/pico2hsm"

# Automatically sync from the primary when a local device is detected.
sync_on_connect = true

# Health check interval (seconds).
health_check_interval_secs = 60

# The primary peer -- this daemon connects here to fetch key state.
[[peers]]
name = "hsm-primary"
address = "192.168.1.10"
port = 7777
role = "primary"
