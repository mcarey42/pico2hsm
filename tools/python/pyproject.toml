[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pico2hsm"
version = "1.0.0"
description = "Python daemon and CLI for the pico2hsm USB HSM"
license = "MIT"
authors = [
    { name = "Mark Carey", email = "mcarey@solcore.net" },
]
requires-python = ">=3.10"
keywords = ["hsm", "pico2hsm", "smartcard", "sc-hsm", "piv", "openpgp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pyscard>=2.0.7",
    "cryptography>=41.0.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "base58>=2.1.1",
    "pyyaml>=6.0",
    "pyudev>=0.24",
]

[project.urls]
Homepage = "https://github.com/mcarey42/pico2hsm"
Repository = "https://github.com/mcarey42/pico2hsm"

# NOTE: console entry points deliberately omitted.
# No `pico2hsm/__main__.py` exists in the package; the standalone scripts
# `hsm-tool.py` and `hsm_daemon.py` live at the top of tools/python/ and are
# not importable package modules. Add [project.scripts] once the package
# exposes proper entry-point functions.
# [project.scripts]

[tool.setuptools.packages.find]
where = ["."]
include = ["pico2hsm*"]
