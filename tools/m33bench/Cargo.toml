[package]
name = "m33bench"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
rand_core = { version = "0.6", default-features = false }
zeroize = { version = "1.7", default-features = false }
heapless = { version = "0.9" }
crc32fast = { version = "1.4", default-features = false }
rsa = { version = "0.9", default-features = false, features = ["hazmat"], optional = true }
embedded-alloc = { version = "0.6", optional = true }

[features]
rsacmp = ["dep:rsa", "dep:embedded-alloc"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = true

# As the firmware's dev profile builds them (the measured device times).
[profile.release.package.num-bigint-dig]
opt-level = 3

[profile.release.package.rsa]
opt-level = 3
