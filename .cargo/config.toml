[target.thumbv8m.main-none-eabihf]
runner = "probe-rs run --chip RP2350"
rustflags = [
    "-C", "link-arg=--nmagic",
    # The RP2350's Arm cores are Cortex-M33 with the DSP extension.  The
    # generic ARMv8-M Mainline target leaves DSP instructions and the M33
    # scheduling model out; with them, the bignum Montgomery loop (RSA key
    # generation) is 3-5% faster and the image slightly smaller.
    "-C", "target-cpu=cortex-m33",
]

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_RTT_BUFFER_SIZE = "4096"
