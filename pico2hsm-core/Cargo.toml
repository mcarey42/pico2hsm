[package]
name = "pico2hsm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Shared no_std core types and traits for the pico2hsm USB HSM (SC-HSM, PIV, OpenPGP)"
readme = "../README.md"
keywords = ["hsm", "smartcard", "rp2350", "no-std", "embedded"]
categories = ["embedded", "cryptography", "no-std"]

[features]
default = []
# Enable std for host-side tooling
std = []

[dependencies]
heapless = { version = "0.9", default-features = false, features = ["zeroize"] }
subtle = { version = "2.5", default-features = false }
zeroize = { version = "1.7", default-features = false, features = ["zeroize_derive"] }

[dev-dependencies]

[lints]
workspace = true
