[workspace]
members = [
    "pico2hsm-core",
    "layout",
    "firmware",

    "tests/integration",
]
resolver = "2"

[workspace.package]
version = "2.1.0"
rust-version = "1.75"
edition = "2021"
license = "MIT"
repository = "https://github.com/mcarey42/pico2hsm"
homepage = "https://github.com/mcarey42/pico2hsm"
authors = ["Mark Carey"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_import_braces = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Default clippy set for every crate (CI: -D warnings).  `pico2hsm-core`
# additionally opts into `pedantic` in its lib.rs; the firmware does not yet
# (~900 mostly doc-backtick hits).

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = true

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

