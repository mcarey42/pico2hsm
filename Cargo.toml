[workspace]
members = [
    "pico2hsm-core",
    "firmware",

    "tests/integration",
]
resolver = "2"

[workspace.package]
rust-version = "1.75"
edition = "2021"
license = "MIT"
repository = "https://github.com/mcarey42/pico2hsm"
homepage = "https://github.com/mcarey42/pico2hsm"
authors = ["Mark Carey"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = true

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

