[workspace]
members = [
    "pico2hsm-core",
    "firmware",
    "tools/hsm-tool",
    "tests/integration",
    "daemon",
]
resolver = "2"

[workspace.package]
rust-version = "1.75"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = true

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
