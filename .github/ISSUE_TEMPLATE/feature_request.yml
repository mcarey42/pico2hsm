name: Feature request
description: Propose a new capability, applet, or developer-experience improvement.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an enhancement. Please describe the problem you are trying to
        solve first, then what you would like to see. Concrete user stories help a lot.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do? What is the current gap or friction?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the ideal behaviour or API look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you rejected them.
    validations:
      required: false
  - type: checkboxes
    id: willing
    attributes:
      label: Willing to implement
      options:
        - label: I am willing to open a PR for this (maintainer review still required).
          required: false
