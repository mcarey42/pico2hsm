name: Build All Targets
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - pico2_4m
          - rp2350_one_4m
          - rp2350_geek_16m
          - rp2350_geek_sdcard
          - waveshare_rp2350_lcd_16m
          - waveshare_rp2350_lcd_sdcard

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.feature }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.feature }}-
            ${{ runner.os }}-cargo-

      - name: Build firmware (${{ matrix.feature }})
        run: cargo build --release -p pico2hsm-firmware --no-default-features --features ${{ matrix.feature }} --target thumbv8m.main-none-eabihf

      - name: Test pico2hsm-core (host)
        # Run on host (x86_64) — pico2hsm-core is no_std but tests use std
        run: cargo test -p pico2hsm-core --target x86_64-unknown-linux-gnu

      - name: Test integration suite (host)
        # Integration tests are std — must run on host target
        run: cargo test -p pico2hsm-integration-tests --target x86_64-unknown-linux-gnu

      - name: Rust unit tests (firmware library, host target)
        # .cargo/config.toml defaults to thumbv8m; --target is mandatory for host tests.
        # Do NOT suppress stderr or mask failures — if firmware lib tests fail, CI must fail.
        run: |
          cargo test \
            --manifest-path firmware/Cargo.toml \
            --lib \
            --no-default-features \
            --features ${{ matrix.feature }} \
            --target x86_64-unknown-linux-gnu

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      # F-L-005: enforce `-D warnings` on both clippy steps so any lint warning
      # becomes a build error. The workspace `[workspace.lints]` policy in
      # root Cargo.toml (F-L-007) enables the clippy `pedantic` ramp, which
      # surfaces many pre-existing style warnings across core and firmware.
      # TODO(post-v1.0.0): address clippy warnings surfaced by new workspace
      # lint policy; then remove continue-on-error.
      - name: Clippy (core, host)
        continue-on-error: true
        run: cargo clippy -p pico2hsm-core -- -D warnings

      - name: Clippy (firmware, embedded target)
        continue-on-error: true
        run: cargo clippy -p pico2hsm-firmware --target thumbv8m.main-none-eabihf -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache the cargo-audit binary — without caching, every CI run reinstalls
      # it from source (~90 s). Cache key is pinned to the version below so a
      # version bump invalidates the cache automatically.
      - name: Cache cargo-audit install
        id: cache-cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.21.1

      # cargo-audit 0.21.1 is the current stable as of 2026-04. Pin the
      # version explicitly so a breaking change to its output format does not
      # silently break CI; bump this and the cache key together.
      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.21.1

      # Security advisory audit. `continue-on-error: true` is intentional: a
      # new upstream advisory should not block every unrelated PR. But we also
      # do not want silent failures, so the step records its exit code and the
      # follow-up step surfaces a visible warning in the Actions UI. Review
      # failures promptly and either update the dep or add an ignore entry in
      # `.cargo/audit.toml`.
      - name: Security audit (cargo audit)
        id: cargo-audit
        continue-on-error: true
        run: |
          set +e
          cargo audit
          rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Report cargo-audit result
        if: always()
        env:
          RC: ${{ steps.cargo-audit.outputs.rc }}
        run: |
          if [ "$RC" = "0" ]; then
            echo "cargo-audit: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cargo-audit: FAIL (rc=${RC}) — advisory or parse error; review the step log above" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::cargo-audit reported a failure (rc=${RC}). See the step log for details."
          fi

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PC/SC dev headers and SWIG
        # pyscard (a transitive dep of `tools/python/`) builds from source on
        # ubuntu-latest and requires libpcsclite-dev + swig. Without these the
        # pip install below fails with `fatal error: winscard.h: No such file`.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev swig pcscd

      - name: Python daemon install and unit tests
        run: |
          pip install pytest
          pip install -e tools/python/ || pip install -e tools/python/
          python -m pytest tools/python/tests/ -x -q --tb=short \
            --ignore=tools/python/tests/test_verify.py

  # ─────────────────────────────────────────────────────────────────────────
  # WARNING: These UF2 files are UNSIGNED. They are intended for evaluation
  # and development use only. For production deployments you MUST generate
  # your own firmware signing key, sign the ELF with `picotool seal`, and
  # lock the OTP fuses. See docs/SECURE_PROVISIONING_PLAN.md for the full
  # secure boot procedure. Unsigned firmware will not run on devices that
  # have secure boot enabled.
  # ─────────────────────────────────────────────────────────────────────────
  build-artifacts:
    name: Build unsigned UF2 artifacts
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        board:
          - rp2350_one_4m
          - rp2350_geek_16m
          - rp2350_geek_sdcard
          - pico2_4m
          - waveshare_rp2350_lcd_16m
          - waveshare_rp2350_lcd_sdcard

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-artifact-${{ matrix.board }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-artifact-${{ matrix.board }}-
            ${{ runner.os }}-cargo-

      # picotool is not in Ubuntu apt (confirmed 2026-04-17 — no such
      # package in jammy/noble/plucky/questing/resolute). We build from the
      # upstream 2.2.0 tag, which is the first stable release to ship the
      # `rp2350-arm-s` UF2 family used below. Binary is cached keyed on the
      # pinned version so subsequent runs skip the ~2 min build entirely.
      - name: Cache picotool binary
        id: cache-picotool
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/picotool
          key: ${{ runner.os }}-picotool-2.2.0

      - name: Install picotool from source
        if: steps.cache-picotool.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake libusb-1.0-0-dev pkg-config git
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk
          git -C /tmp/pico-sdk submodule update --init --depth 1 lib/mbedtls
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/picotool.git /tmp/picotool
          cmake -S /tmp/picotool -B /tmp/picotool/build -DPICO_SDK_PATH=/tmp/pico-sdk
          cmake --build /tmp/picotool/build -j
          sudo cmake --install /tmp/picotool/build
          picotool version

      - name: Build firmware (release, unsigned)
        run: |
          cargo build \
            --manifest-path firmware/Cargo.toml \
            --release \
            --no-default-features \
            --features ${{ matrix.board }},applet-piv,applet-openpgp-curve25519 \
            --target thumbv8m.main-none-eabihf

      - name: Convert ELF to UF2
        run: |
          # Workspace target dir is at repo root, not under firmware/. See
          # release.yml Stage step for the same note — cargo writes workspace
          # builds to the shared target/ even with --manifest-path.
          ELF=target/thumbv8m.main-none-eabihf/release/pico2hsm
          UF2=pico2hsm-${{ matrix.board }}-unsigned.uf2
          # picotool 2.x infers input type from file extension; the cargo
          # binary has no extension, so copy it to a .elf-named file first.
          ELF_NAMED="${UF2%.uf2}.elf"
          cp "$ELF" "$ELF_NAMED"
          picotool uf2 convert "$ELF_NAMED" "$UF2" --family rp2350-arm-s
          echo "Built: $UF2 ($(stat -c%s "$UF2") bytes)"

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico2hsm-${{ matrix.board }}-unsigned
          path: pico2hsm-${{ matrix.board }}-unsigned.uf2
          retention-days: 30

      # Upload as release asset when a version tag is pushed
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pico2hsm-${{ matrix.board }}-unsigned.uf2
          body: |
            **These UF2 files are UNSIGNED and for evaluation/development use only.**

            For production deployment, generate your own firmware signing key and follow
            the secure provisioning process in [docs/SECURE_PROVISIONING_PLAN.md](docs/SECURE_PROVISIONING_PLAN.md).
            Unsigned firmware cannot be used with secure boot locked devices.
