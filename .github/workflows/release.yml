name: Release

# Tag-triggered release workflow.
#
# Builds UF2 firmware for every supported board, emits per-crate CycloneDX
# SBOMs, collects SHA256SUMS across all boards, extracts the matching
# CHANGELOG.md section for the release body, and publishes a GitHub Release
# with all assets attached.
#
# IMPORTANT: The UF2 artifacts attached to the release are UNSIGNED. Production
# signing is performed offline with the owner's own signing keys and
# `picotool seal --hash --sign`. See docs/PROVISIONING.md for the full
# procedure.
#
# Dry-run mode: push a tag with a `-ci-test` suffix (e.g. `v1.0.0-ci-test`) to
# exercise the workflow. The workflow still publishes a GitHub Release — you
# must delete it (and the tag) manually afterwards. See docs/RELEASE_PROCESS.md.
#
# Security note: tag names are GitHub-validated git refs (not free-form user
# text) and are read via `github.ref` only. Where a tag value is used inside a
# `run:` step, it is passed via `env:` and quoted, never interpolated directly.

on:
  push:
    tags:
      - 'v*'

# Read-only token by default; only the release job publishes.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: build UF2 for every board in the matrix.
  # Produces <board>.uf2, <board>.elf, and <board>.uf2.sha256 per board.
  # Modelled on the build-artifacts job in build.yml:118-191.
  # ---------------------------------------------------------------------------
  build-uf2:
    name: Build UF2 (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - pico2_4m
          - rp2350_one_4m
          - rp2350_one_16m
          - rp2350_geek_16m
          - rp2350_geek_sdcard
          - waveshare_rp2350_lcd_16m
          - waveshare_rp2350_lcd_sdcard

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          targets: thumbv8m.main-none-eabihf

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.board }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ matrix.board }}-
            ${{ runner.os }}-cargo-artifact-${{ matrix.board }}-
            ${{ runner.os }}-cargo-

      # picotool is not in Ubuntu apt (confirmed 2026-04-17 — no such
      # package in jammy/noble/plucky/questing/resolute). We build from the
      # upstream 2.2.0 tag, which is the first stable release to ship the
      # `rp2350-arm-s` UF2 family used below. Binary is cached keyed on the
      # pinned version so subsequent runs skip the ~2 min build entirely.
      - name: Cache picotool binary
        id: cache-picotool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/picotool
          key: ${{ runner.os }}-picotool-2.2.0

      - name: Install picotool from source
        if: steps.cache-picotool.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake libusb-1.0-0-dev pkg-config git
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk
          git -C /tmp/pico-sdk submodule update --init --depth 1 lib/mbedtls
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/picotool.git /tmp/picotool
          cmake -S /tmp/picotool -B /tmp/picotool/build -DPICO_SDK_PATH=/tmp/pico-sdk
          cmake --build /tmp/picotool/build -j
          sudo cmake --install /tmp/picotool/build
          picotool version

      - name: Build and stage firmware (release, unsigned)
        env:
          BOARD: ${{ matrix.board }}
        # Two images per board, all applets and RSA (the default features):
        #   pico2hsm-<board>-unsigned: the production image.  Its keystore
        #     works only on an OTP-provisioned device (docs/PROVISIONING.md);
        #     on a blank chip it stays down by design.
        #   pico2hsm-<board>-dev-INSECURE-keystore-unsigned: adds
        #     `insecure-dev-keystore`, so the keystore opens under a fixed
        #     development key on a chip without OTP provisioning.  For
        #     evaluation only: anyone with the flash contents can read it.
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Workspace target dir is at repo root, not under firmware/. When
          # `cargo build --manifest-path firmware/Cargo.toml` runs inside a
          # Cargo workspace, cargo writes to the workspace's shared target/.
          ELF_SRC=target/thumbv8m.main-none-eabihf/release/pico2hsm
          FEATURES="${BOARD},rsa,applet-piv,applet-openpgp-curve25519"
          for VARIANT in prod dev; do
            if [ "$VARIANT" = prod ]; then
              BASE="pico2hsm-${BOARD}-unsigned"; EXTRA=""
            else
              BASE="pico2hsm-${BOARD}-dev-INSECURE-keystore-unsigned"; EXTRA=",insecure-dev-keystore"
            fi
            cargo build \
              --manifest-path firmware/Cargo.toml \
              --release \
              --no-default-features \
              --features "${FEATURES}${EXTRA}" \
              --target thumbv8m.main-none-eabihf
            # picotool 2.x infers input type from file extension; the cargo
            # binary has no extension (`[[bin]] name = "pico2hsm"`), so
            # convert the staged .elf copy.
            cp "$ELF_SRC" "release-assets/${BASE}.elf"
            picotool uf2 convert "release-assets/${BASE}.elf" "release-assets/${BASE}.uf2" --family rp2350-arm-s
            ( cd release-assets && sha256sum "${BASE}.uf2" > "${BASE}.uf2.sha256" )
          done
          # The board's partition tables (docs/FLASH_LAYOUT_2_0.md): install
          # once, then the firmware.  -dev keeps the table replaceable from
          # BOOTSEL; -prod (to be signed at provisioning) does not.
          SIZE=$(cargo run -q -p pico2hsm-layout --features std --target x86_64-unknown-linux-gnu -- profile "$BOARD")
          for KIND in dev prod; do
            JSON="boards/pt_${SIZE}.json"
            [ "$KIND" = prod ] && JSON="boards/pt_${SIZE}_prod.json"
            PT="pico2hsm-${BOARD}-pt-${KIND}.uf2"
            picotool partition create "$JSON" "release-assets/${PT}"
            ( cd release-assets && sha256sum "${PT}" > "${PT}.sha256" )
          done
          ls -la release-assets

      - name: Upload per-board artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uf2-${{ matrix.board }}
          path: release-assets/*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: emit CycloneDX SBOMs for each workspace member.
  # cargo-sbom outputs CycloneDX JSON. One SBOM per workspace member.
  # ---------------------------------------------------------------------------
  sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          targets: thumbv8m.main-none-eabihf

      - name: Cache cargo-sbom install
        id: cache-sbom
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-sbom
          # Pin version in the cache key so a version bump invalidates it.
          key: ${{ runner.os }}-cargo-sbom-0.9.1

      - name: Install cargo-sbom
        if: steps.cache-sbom.outputs.cache-hit != 'true'
        # cargo-sbom 0.9.1 produces CycloneDX JSON; pinning the version keeps
        # the SBOM schema stable across releases.
        run: cargo install cargo-sbom --locked --version 0.9.1

      - name: Generate SBOMs per workspace member
        run: |
          set -euo pipefail
          mkdir -p sbom-output
          for crate in pico2hsm-core firmware pico2hsm-integration-tests; do
            echo "=== SBOM for $crate ==="
            cargo sbom \
              --cargo-package "$crate" \
              --output-format cyclone_dx_json_1_4 \
              > "sbom-output/${crate}.cdx.json"
            ls -la "sbom-output/${crate}.cdx.json"
          done

      - name: Fallback — always emit cargo tree dump
        if: always()
        run: |
          mkdir -p sbom-output
          cargo tree \
            --manifest-path firmware/Cargo.toml \
            --no-default-features \
            --features pico2_4m,applet-piv,applet-openpgp-curve25519 \
            --target thumbv8m.main-none-eabihf \
            --prefix none \
            --format "{p} {l}" \
            > sbom-output/cargo-tree-firmware-pico2_4m.txt || true

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-output/*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3: assemble release assets, extract CHANGELOG section, publish release.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build-uf2, sbom]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all UF2 artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: uf2-*
          path: downloaded-artifacts/
          merge-multiple: true

      - name: Download SBOM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: downloaded-artifacts/

      - name: Assemble release directory
        id: assemble
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          mkdir -p release
          # Copy every asset to the release directory.
          find downloaded-artifacts -maxdepth 2 -type f -exec cp {} release/ \;
          ls -la release

          # Combine per-board SHA256 files into a single SHA256SUMS file.
          ( cd release && cat ./*.uf2.sha256 > SHA256SUMS )
          echo "=== SHA256SUMS ==="
          cat release/SHA256SUMS

          # Verify every expected board is represented — fail loudly otherwise.
          EXPECTED_BOARDS=(pico2_4m rp2350_one_4m rp2350_one_16m rp2350_geek_16m rp2350_geek_sdcard waveshare_rp2350_lcd_16m waveshare_rp2350_lcd_sdcard)
          MISSING=()
          for b in "${EXPECTED_BOARDS[@]}"; do
            for f in "pico2hsm-${b}-unsigned.uf2" "pico2hsm-${b}-dev-INSECURE-keystore-unsigned.uf2" \
                     "pico2hsm-${b}-pt-dev.uf2" "pico2hsm-${b}-pt-prod.uf2"; do
              if ! ls "release/${f}" >/dev/null 2>&1; then
                MISSING+=("$f")
              fi
            done
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "ERROR: missing UF2 artifacts for boards: ${MISSING[*]}" >&2
            exit 1
          fi

          # Tag comes from github.ref (validated git ref). Strip prefix.
          TAG="${REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-ci-test ]]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section for this tag
        id: changelog
        env:
          VERSION: ${{ steps.assemble.outputs.version }}
        # Extract the `## [VERSION]` section from CHANGELOG.md. If CHANGELOG.md
        # does not exist or the section is missing, emit a placeholder rather
        # than failing — the release body falls back to the UNSIGNED warning
        # + SHA256SUMS excerpt.
        run: |
          set -euo pipefail
          OUTFILE=release-notes-body.md
          if [ ! -f CHANGELOG.md ]; then
            echo "_(CHANGELOG.md not present in the repo; release notes body was not populated.)_" > "$OUTFILE"
          else
            # Match `## [VERSION]` (optionally followed by ` - DATE`) and emit
            # lines until the next `## [` header.
            awk -v ver="$VERSION" '
              BEGIN { in_section = 0; found = 0 }
              /^## \[/ {
                if (in_section) { exit }
                header = $0
                sub(/^## \[/, "", header)
                sub(/\].*$/, "", header)
                if (header == ver) { in_section = 1; found = 1; next }
              }
              in_section { print }
              END { if (!found) { exit 3 } }
            ' CHANGELOG.md > "$OUTFILE" || {
              echo "_(No CHANGELOG.md section found for version ${VERSION}.)_" > "$OUTFILE"
            }
          fi
          echo "=== release-notes-body.md ==="
          cat "$OUTFILE"
          echo "path=${OUTFILE}" >> "$GITHUB_OUTPUT"

      - name: Compose release body
        id: body
        env:
          TAG: ${{ steps.assemble.outputs.tag }}
          DRY: ${{ steps.assemble.outputs.dry_run }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.path }}
        run: |
          set -euo pipefail
          OUT=release-body.md

          {
            if [ "$DRY" = "true" ]; then
              echo "> **DRY-RUN BUILD** — this release was produced by a \`-ci-test\` tag and should be deleted before consumers see it."
              echo ""
            fi
            echo "## :warning: UNSIGNED FIRMWARE"
            echo ""
            echo "The UF2 files attached to this release are **unsigned**. pico2hsm ships no"
            echo "signing keys: for a device with secure boot you generate your own keys, sign"
            echo "the ELF with \`picotool seal --hash --sign\` and provision the OTP; see"
            echo "[docs/PROVISIONING.md](docs/PROVISIONING.md). Unsigned firmware does not run on"
            echo "a device with secure boot enabled."
            echo ""
            echo "## Which file to install"
            echo ""
            echo "Install the board's partition table first (\`pico2hsm-<board>-pt-dev.uf2\`),"
            echo "then the firmware (\`picotool load -p 0 -x <file>.uf2\`); see"
            echo "[docs/FLASH_LAYOUT_2_0.md](docs/FLASH_LAYOUT_2_0.md) §4."
            echo ""
            echo "- \`pico2hsm-<board>-unsigned.uf2\`: the production image. Its keystore only"
            echo "  opens on a device whose OTP holds a storage secret (provisioning stage 2); on"
            echo "  a blank chip every key operation fails, by design."
            echo "- \`pico2hsm-<board>-dev-INSECURE-keystore-unsigned.uf2\`: for evaluation on a"
            echo "  chip without OTP provisioning. The keystore is sealed under a fixed,"
            echo "  public development key: **anyone with the flash contents can read every"
            echo "  key.** Never use it for keys you care about."
            echo ""
            echo "Use RP2350 **A4** silicon for business or production use: A2/A3 have erratum"
            echo "RP2350-E24 (secure-boot bypass by glitching plus a flash swap)."
            echo ""
            echo "## Changes"
            echo ""
            cat "$CHANGELOG_BODY"
            echo ""
            echo "## SHA256SUMS"
            echo ""
            echo '```'
            cat release/SHA256SUMS
            echo '```'
            echo ""
            echo "## Assets"
            echo ""
            echo "- \`pico2hsm-<board>-[dev-INSECURE-keystore-]unsigned.uf2\` — firmware image (UF2, RP2350 family \`rp2350-arm-s\`)."
            echo "- \`…-unsigned.elf\` — the same image as ELF (for signing with picotool seal, and debugging)."
            echo "- \`pico2hsm-<board>-pt-dev.uf2\` / \`-pt-prod.uf2\` — the board's partition table (prod: sign it at provisioning)."
            echo "- \`<board>.uf2.sha256\` — per-file SHA256 (also aggregated in SHA256SUMS)."
            echo "- \`*.cdx.json\` — CycloneDX 1.4 SBOM, one per workspace crate."
            echo ""
            echo "Verify downloads with:"
            echo ""
            echo '```sh'
            echo "sha256sum -c SHA256SUMS"
            echo '```'
          } > "$OUT"

          echo "path=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.assemble.outputs.tag }}
          name: ${{ steps.assemble.outputs.tag }}
          body_path: ${{ steps.body.outputs.path }}
          prerelease: ${{ contains(steps.assemble.outputs.tag, '-') }}
          files: |
            release/*.uf2
            release/*.elf
            release/*.uf2.sha256
            release/SHA256SUMS
            release/*.cdx.json
            release/cargo-tree-*.txt
          fail_on_unmatched_files: false
