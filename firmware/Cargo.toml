[package]
name = "pico2hsm-firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "pico2hsm USB HSM firmware for Raspberry Pi RP2350/RP2354 — SC-HSM, PIV, OpenPGP applets over CCID"
readme = "../README.md"
keywords = ["hsm", "smartcard", "rp2350", "ccid", "pkcs11"]
categories = ["embedded", "cryptography", "hardware-support"]

[lib]
name = "pico2hsm_firmware"
# lib target for unit testing without hardware
test = true

[[bin]]
name = "pico2hsm"
path = "src/main.rs"
test = false

[features]
default = ["rp2350_one_4m", "rsa", "applet-piv", "applet-openpgp-curve25519"]
rp2350_one_4m = ["uart-debug"]
rp2350_geek_16m = ["uart-debug"]
rp2350_geek_sdcard = ["uart-debug"]
pico2_4m = []
waveshare_rp2350_lcd_16m = ["uart-debug"]
# Waveshare RP2350-LCD-1.47-B: single SD card keystore on SPI1 (CS=GPIO15)
waveshare_rp2350_lcd_sdcard = ["uart-debug"]
uart-debug = []     # UART1 PAC-direct debug output — implied by probe-less boards
rsa = ["dep:rsa", "dep:embedded-alloc"]  # RSA support — adds ~1MB to binary; disabled by default
debug = []         # Debug mode: enables memory dump APDUs, disables secure boot enforcement
applet-piv = ["dep:des"]                 # PIV applet (NIST SP 800-73-4); adds 3DES (~10 KB)
applet-openpgp = []                      # OpenPGP Card 3.4 applet (RSA + NIST ECC)
applet-openpgp-curve25519 = ["applet-openpgp", "dep:ed25519-dalek", "dep:x25519-dalek"]  # Adds Ed25519/X25519 (~50 KB)

# ─── Platform-agnostic dependencies ──────────────────────────────────────────
# All of these compile on both x86_64 (for tests) and thumbv8m.main-none-eabihf
[dependencies]
pico2hsm-core = { path = "../pico2hsm-core" }

# Utilities (no_std compatible)
heapless = { version = "0.9", features = ["zeroize"] }

# Security primitives
zeroize = { version = "1.7", default-features = false, features = ["zeroize_derive"] }
subtle = { version = "2.5", default-features = false }

# Hash / integrity
blake2 = { version = "0.10", default-features = false }
crc32fast = { version = "1.4", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["oid"] }
sha1 = { version = "0.10", default-features = false, features = ["oid"] }

# Symmetric ciphers — use stable RustCrypto 0.x (not RC versions)
aes = { version = "0.8", default-features = false }
ctr = { version = "0.9", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
cmac = { version = "0.7", default-features = false }
cbc = { version = "0.1", default-features = false, features = ["block-padding"] }
# 3DES for PIV GENERAL AUTHENTICATE (ECB, single 8-byte block, 24-byte key).
# Pin to 0.8.1 — 0.9.0-rc.3 bumps cipher to 0.5 which conflicts with our cipher 0.4 pins.
des = { version = "0.8.1", default-features = false, features = ["zeroize"], optional = true }
chacha20poly1305 = { version = "0.10", default-features = false }
cipher = { version = "0.4", default-features = false, features = ["block-padding"] }

# Key derivation
hkdf = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = { version = "0.12", default-features = false }

# Elliptic curves
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "arithmetic", "sha256"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "arithmetic", "sha384"] }
p521 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "arithmetic", "sha512"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "arithmetic", "sha256"] }

# ECC trait crates — versions match those re-exported by p256/p384/p521/k256
ecdsa = { version = "0.16", default-features = false, features = ["hazmat", "der"] }
elliptic-curve = { version = "0.13", default-features = false, features = ["arithmetic", "sec1", "ecdh"] }
rand_core = { version = "0.6", default-features = false }

# Curve25519 — feature-gated (applet-openpgp-curve25519)
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"], optional = true }
x25519-dalek  = { version = "2", default-features = false, features = ["static_secrets"], optional = true }

# RSA — feature-gated because it adds ~1MB to the binary
rsa = { version = "0.9", default-features = false, features = ["hazmat"], optional = true }

# Heap allocator for RSA big-integer arithmetic (no_std compatible)
embedded-alloc = { version = "0.6", optional = true }

# ─── ARM / bare-metal only dependencies ──────────────────────────────────────
# These are only compiled when targeting thumbv8m.main-none-eabihf (or any arm
# target). They are NOT available during `cargo test --target x86_64-...`.
# Modules that import from these crates must be gated with
# `#[cfg(target_arch = "arm")]`.
[target.'cfg(target_arch = "arm")'.dependencies]

# Embassy async runtime for Cortex-M / RP2350
embassy-rp = { version = "0.10", features = ["rp235xa", "unstable-pac", "time-driver", "defmt", "imagedef-none"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
static_cell = { version = "2", default-features = false }

embassy-usb = { version = "0.6" }
embassy-futures = { version = "0.1" }
embassy-sync = { version = "0.8" }
embassy-time = { version = "0.5" }
embassy-embedded-hal = { version = "0.6" }

# Hardware abstraction
embedded-hal = { version = "1.0" }
embedded-hal-async = { version = "1.0" }
embedded-sdmmc = { version = "0.9" }

# Logging / diagnostics
defmt = { version = "0.3" }
defmt-rtt = { version = "0.4", features = ["disable-blocking-mode"] }

# ARM Cortex-M runtime
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7" }
panic-probe = { version = "0.3", features = ["print-defmt"] }

# ChaCha20 stream cipher — used as CSPRNG state in crypto::rng (reseed hook)
chacha20 = { version = "0.9", default-features = false }

# Noise Protocol Framework (DKEK exchange — not yet used on x86_64 tests)
snow = { version = "0.10", default-features = false }

# Display rendering — embedded-graphics provides DrawTarget trait + text rendering
# mono_font feature enables MonoTextStyle + built-in ASCII font data (FONT_6X10, FONT_8X13)
embedded-graphics = { version = "0.8" }

[dev-dependencies]
hex = { version = "0.4" }
heapless = { version = "0.9" }
rand_core = { version = "0.6" }

[build-dependencies]

[lints]
workspace = true
