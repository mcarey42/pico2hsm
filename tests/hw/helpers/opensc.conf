# OpenSC configuration for the hardware tests (conftest.py sets OPENSC_CONF
# to this file unless OPENSC_CONF is already set).
#
# OpenSC's PKCS#11 module has 16 virtual slots by default and gives each
# reader 4, so it lists only the first four readers: with a fifth board
# attached, pkcs11-tool cannot see it and every PKCS#11 test against it
# fails.  Everything else stays at OpenSC's defaults.
app default {
}
app opensc-pkcs11 {
	pkcs11 {
		max_virtual_slots = 64;
	}
}
